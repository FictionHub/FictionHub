name: Build & Release FictionHub Installer & APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    outputs:
      FH_VERSION: ${{ steps.stage-win.outputs.FH_VERSION }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install build tooling (root)
        run: npm ci

      - name: Install app dependencies
        working-directory: app-src
        run: npm ci

      - name: Stamp app version & write release notes
        shell: pwsh
        run: |
          $pkgPath = 'app-src/package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $base = @($pkg.version -split '\.')
          $ver = '{0}.{1}.{2}' -f $base[0], $base[1], ([int]$base[2] + [int]$env:GITHUB_RUN_NUMBER)
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding utf8
          "FH_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Stamping version $ver (base $($base -join '.') + run $env:GITHUB_RUN_NUMBER)"

          $prev = (git tag --list 'v*' --sort=-version:refname | Select-Object -First 1)
          $range = if ($prev) { "$prev..HEAD" } else { '' }
          $lines = if ($range) { git log $range --pretty=format:%h%x20%s } else { git log -20 --pretty=format:%h%x20%s }
          $commits = @($lines | ForEach-Object { "- $_" })
          if (-not $commits) { $commits = @('- Maintenance and bug fixes.') }
          $notes = @("### What's changed in v$ver", '') + $commits
          if ($prev) {
            $notes += ''
            $notes += "**Full Changelog**: https://github.com/FictionHub/FictionHub/compare/$prev...v$ver"
          }
          ($notes -join "`n") | Set-Content -Path release-notes.md -Encoding utf8
          Write-Output "Release notes (previous tag: $prev):"
          Get-Content release-notes.md

      - name: Build NSIS installer
        run: npm run build

      - name: Stage Windows release files
        id: stage-win
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter '*Setup*.exe' -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notlike '*uninstaller*' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Error 'Installer was not produced by the build.'; exit 1 }
          $dir = $exe.DirectoryName
          $yml = Get-ChildItem -Path $dir -Filter 'latest.yml' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $yml) { Write-Error 'latest.yml was not produced by the build.'; exit 1 }
          $bm = Get-ChildItem -Path $dir -Filter "$($exe.Name).blockmap" -ErrorAction SilentlyContinue | Select-Object -First 1

          $ymlText = Get-Content $yml.FullName -Raw
          $target = if ($ymlText -match '(?m)^\s*(?:-\s*)?url:\s*(\S+)') { $Matches[1] }
                    elseif ($ymlText -match '(?m)^\s*path:\s*(\S+)') { $Matches[1] }
                    else { $exe.Name }

          $ver = $env:FH_VERSION
          $out = Join-Path $PWD 'release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName -Destination (Join-Path $out $target)
          if ($bm) { Copy-Item $bm.FullName -Destination (Join-Path $out "$target.blockmap") }
          Copy-Item $yml.FullName -Destination $out
          Copy-Item (Join-Path $PWD 'release-notes.md') -Destination $out
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          "name=FictionHub v$ver" >> $env:GITHUB_OUTPUT
          "FH_VERSION=$ver" >> $env:GITHUB_OUTPUT
          Get-ChildItem $out | ForEach-Object { Write-Output "staged: $($_.Name)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FictionHub-Windows-Setup
          path: release/*
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - name: Install build tooling (root)
        run: npm ci

      - name: Install app dependencies
        working-directory: app-src
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Copy web assets to Android public assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r app-src/www/* android/app/src/main/assets/public/
          cp app-src/*.js android/app/src/main/assets/public/
          cp app-src/*.css android/app/src/main/assets/public/
          cp app-src/*.html android/app/src/main/assets/public/

      - name: Stamp Android version
        shell: bash
        run: |
          # Same strictly-increasing version formula as the Windows job:
          # base patch + run number (run numbers only ever grow).
          # node reads package.json so this needs no jq.
          baseVer=$(node -p "require('./app-src/package.json').version")
          base=$(echo "$baseVer" | cut -d. -f1,2)
          patch=$(echo "$baseVer" | cut -d. -f3)
          ver="${base}.$((patch + GITHUB_RUN_NUMBER))"
          echo "FH_VERSION=$ver" >> $GITHUB_ENV
          echo "Building Android version $ver"

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fictionhub-release.jks"
            echo "Using the configured Android release keystore."
          else
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/fictionhub-release.jks" \
              -storepass fictionhub-ci \
              -keypass fictionhub-ci \
              -alias fictionhub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=FictionHub CI, OU=Build, O=FictionHub, L=CI, ST=CI, C=US"
            echo "Android signing secrets are not configured; generated a temporary CI keystore."
            ANDROID_KEYSTORE_PASSWORD=fictionhub-ci
            ANDROID_KEY_ALIAS=fictionhub
            ANDROID_KEY_PASSWORD=fictionhub-ci
          fi
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/fictionhub-release.jks"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ env.FH_VERSION }} --no-daemon --stacktrace
        timeout-minutes: 30

      - name: Find APK
        id: find-apk
        working-directory: android
        run: |
          echo "=== Searching for APKs ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found in release, checking all outputs..."
            APK_PATH=$(find app/build/outputs -name "*.apk" -not -name "*unsigned*" | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK found anywhere!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Stage Android release files
        id: stage-android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/release"
          mkdir -p "$out"
          apk_path="${{ steps.find-apk.outputs.apk_path }}"
          apk_name="FictionHub-v${FH_VERSION}-arm64.apk"
          cp "$apk_path" "$out/$apk_name"
          ls -l "$out"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FictionHub-Android-APK
          path: release/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: needs.build-windows.result == 'success' && needs.build-android.result == 'success'
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: FictionHub-Windows-Setup
          path: release/win

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: FictionHub-Android-APK
          path: release/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.FH_VERSION }}
          name: FictionHub v${{ needs.build-windows.outputs.FH_VERSION }}
          make_latest: true
          body_path: release/win/release-notes.md
          fail_on_unmatched_files: false
          files: |
            release/win/*
            release/android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
