name: Build & Release FictionHub Installer & APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tooling (root)
        run: npm install

      - name: Install app dependencies
        working-directory: app-src
        run: npm install

      - name: Stamp app version & write release notes
        shell: pwsh
        run: |
          $pkgPath = 'app-src/package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $base = @($pkg.version -split '\.')
          $ver = '{0}.{1}.{2}' -f $base[0], $base[1], ([int]$base[2] + [int]$env:GITHUB_RUN_NUMBER)
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding utf8
          "FH_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Stamping version $ver (base $($base -join '.') + run $env:GITHUB_RUN_NUMBER)"

          $prev = (git tag --list 'v*' --sort=-version:refname | Select-Object -First 1)
          $range = if ($prev) { "$prev..HEAD" } else { '' }
          $lines = if ($range) { git log $range --pretty=format:%h%x20%s } else { git log -20 --pretty=format:%h%x20%s }
          $commits = @($lines | ForEach-Object { "- $_" })
          if (-not $commits) { $commits = @('- Maintenance and bug fixes.') }
          $notes = @("### What's changed in v$ver", '') + $commits
          if ($prev) {
            $notes += ''
            $notes += "**Full Changelog**: https://github.com/FictionHub/FictionHub/compare/$prev...v$ver"
          }
          ($notes -join "`n") | Set-Content -Path release-notes.md -Encoding utf8
          Write-Output "Release notes (previous tag: $prev):"
          Get-Content release-notes.md

      - name: Build NSIS installer
        run: npm run build

      - name: Stage Windows release files
        id: stage-win
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter '*Setup*.exe' -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notlike '*uninstaller*' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Error 'Installer was not produced by the build.'; exit 1 }
          $dir = $exe.DirectoryName
          $yml = Get-ChildItem -Path $dir -Filter 'latest.yml' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $yml) { Write-Error 'latest.yml was not produced by the build.'; exit 1 }
          $bm = Get-ChildItem -Path $dir -Filter "$($exe.Name).blockmap" -ErrorAction SilentlyContinue | Select-Object -First 1

          $ymlText = Get-Content $yml.FullName -Raw
          $target = if ($ymlText -match '(?m)^\s*(?:-\s*)?url:\s*(\S+)') { $Matches[1] }
                    elseif ($ymlText -match '(?m)^\s*path:\s*(\S+)') { $Matches[1] }
                    else { $exe.Name }

          $ver = $env:FH_VERSION
          $out = Join-Path $PWD 'release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName -Destination (Join-Path $out $target)
          if ($bm) { Copy-Item $bm.FullName -Destination (Join-Path $out "$target.blockmap") }
          Copy-Item $yml.FullName -Destination $out
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          "name=FictionHub v$ver" >> $env:GITHUB_OUTPUT
          Get-ChildItem $out | ForEach-Object { Write-Output "staged: $($_.Name)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FictionHub-Windows-Setup
          path: release/*.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          cmdline-tools-version: latest

      - name: Install build tooling
        run: npm install

      - name: Install app dependencies
        working-directory: app-src
        run: npm install

      - name: Stamp Android version
        shell: bash
        run: |
          pkgPath='app-src/package.json'
          base=$(cat $pkgPath | jq -r .version | cut -d. -f1,2)
          ver="${base}.$((${base##*.} + ${GITHUB_RUN_NUMBER}))"
          ver=$(cat release-notes.md 2>/dev/null | grep -o 'v[0-9.]\+' | head -1 | sed 's/^v//')
          if [ -z "$ver" ]; then
            base=$(cat $pkgPath | jq -r .version | cut -d. -f1,2)
            ver="${base}.$((${base##*.} + ${GITHUB_RUN_NUMBER}))"
          fi
          echo "FH_VERSION=$ver" >> $GITHUB_ENV
          echo "Building Android version $ver"

      - name: Copy web assets to Android
        run: |
          npx cap sync android

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ env.FH_VERSION }}

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Stage Android release files
        id: stage-android
        shell: pwsh
        run: |
          $ver = $env:FH_VERSION
          $apkPath = "${{ steps.find-apk.outputs.apk_path }}"
          $out = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $apkName = "FictionHub-v${ver}-arm64.apk"
          Copy-Item $apkPath -Destination (Join-Path $out $apkName)
          Get-ChildItem $out | ForEach-Object { Write-Output "staged: $($_.Name)" }

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FictionHub-Android-APK
          path: release/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: FictionHub-Windows-Setup
          path: release/win

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: FictionHub-Android-APK
          path: release/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.FH_VERSION }}
          name: FictionHub v${{ needs.build-windows.outputs.FH_VERSION }}
          make_latest: true
          body_path: release/release-notes.md
          fail_on_unmatched_files: false
          files: |
            release/win/*
            release/android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
