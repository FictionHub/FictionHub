apply plugin: 'com.android.library'

// The Node.js server that runs inside the app is a copy of app-src/server.js
// (and friends). When that copy drifts from app-src, the Android app serves
// an OLD server — the player then hits a stale /__stream/resolve without CORS
// headers and the screen stays black. Sync it automatically on every build.
def appSrcDir = file('../../app-src')
def serverAssetsDir = file('src/main/assets/server')

tasks.register('syncServerAssets', Copy) {
    from appSrcDir
    into serverAssetsDir
    // Don't ship build output or the legacy duplicate web/ folder.
    exclude 'www/**', 'node_modules/**', 'build/**', 'dist/**', 'fh-backup.json'
    exclude '*.log', 'package-lock.json'
    include '**/*'
}

android {
    namespace 'com.fictionhub.nodejsserver'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/libnode/bin']
        }
    }
    // Make sure the bundled server is in sync with app-src before packaging.
    tasks.named('preBuild').configure { dependsOn('syncServerAssets') }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libnode.so'
        pickFirst 'lib/arm64-v8a/libnode.so'
        pickFirst 'lib/x86_64/libnode.so'
        pickFirst 'lib/armeabi-v7a/libnodejs-server-native-lib.so'
        pickFirst 'lib/arm64-v8a/libnodejs-server-native-lib.so'
        pickFirst 'lib/x86_64/libnodejs-server-native-lib.so'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
}
